<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recipe App - Your go-to app for delicious recipes.">
    <title>Recipe App</title>
    <link rel="stylesheet" href="./css/home.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header>
            <div class="inner-header">
                <h1>Hi, John!</h1>
                <h2>Explore New Recipes</h3>
            </div>
            <div class="pfp-container">
                <img src="https://cdn.vectorstock.com/i/500p/97/32/man-silhouette-profile-picture-vector-2139732.jpg" alt="profile picture"/>
            </div>
        </header>
        <main>
            <div class="search-container">
                <section>
                    <form class="search-form" onsubmit="return false;">
                        <input type="text" class="search-bar" placeholder="Search Recipes..." onkeypress="if(event.key === 'Enter') { console.log('Search submitted:', this.value); }">
                        <div class="search-icon">
                            <img src="assets/home.png" alt="Filter" style="height: 20px;" alt="search icon">
                        </div>
                    </form>
                </section>
                <section>
                    <div class="search-title">
                        <h3>Popular Recipes</h3>
                        <a>View all</a>
                    </div>
                    <div class="search-options">
                        <div class="option"><span>Most Viewed</span></div>
                        <div class="option"><span>Latest</span></div>
                        <div class="option"><span>Healthy</span></div>
                    </div>
                </section>
            </div>
            <div class="recipes-container">
                <a href="/recipe.html#1" class="card"><img src="https://cdn.apartmenttherapy.info/image/upload/f_jpg,q_auto:eco,c_fill,g_auto,w_1500,ar_1:1/k%2FPhoto%2FRecipes%2F2023-01-Caramelized-Tomato-Paste-Pasta%2F06-CARAMELIZED-TOMATO-PASTE-PASTA-039"/></a>
                <a href="/recipe.html#2" class="card"><img src="https://cdn.apartmenttherapy.info/image/upload/f_jpg,q_auto:eco,c_fill,g_auto,w_1500,ar_1:1/k%2FPhoto%2FRecipes%2F2023-01-Caramelized-Tomato-Paste-Pasta%2F06-CARAMELIZED-TOMATO-PASTE-PASTA-039"/></a>
                <a href="/recipe.html#3" class="card"><img src="https://cdn.apartmenttherapy.info/image/upload/f_jpg,q_auto:eco,c_fill,g_auto,w_1500,ar_1:1/k%2FPhoto%2FRecipes%2F2023-01-Caramelized-Tomato-Paste-Pasta%2F06-CARAMELIZED-TOMATO-PASTE-PASTA-039"/></a>
                <a href="/recipe.html#4" class="card"><img src="https://cdn.apartmenttherapy.info/image/upload/f_jpg,q_auto:eco,c_fill,g_auto,w_1500,ar_1:1/k%2FPhoto%2FRecipes%2F2023-01-Caramelized-Tomato-Paste-Pasta%2F06-CARAMELIZED-TOMATO-PASTE-PASTA-039"/></a>
            </div>
        </main>
        <footer>
            <a><img src="assets/home.png"/></a>
            <a><img src="assets/logout.png"/></a>
        </footer>
    </div>
    <script src="index.js"></script>
</body>
</html>
